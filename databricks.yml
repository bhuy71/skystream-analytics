# Databricks Asset Bundle — SkyStream Analytics
# Docs: https://docs.databricks.com/en/dev-tools/bundles/index.html
#
# Cách deploy:
#   Dev  : databricks bundle deploy --target dev
#   Prod : databricks bundle deploy --target prod
#
# Cách chạy pipeline sau deploy:
#   databricks bundle run skystream_dlt_pipeline --target dev

bundle:
  name: skystream-analytics

# ─── Biến dùng chung ──────────────────────────────────────────────────────────
variables:
  s3_bucket:
    description: "S3 data lake bucket name"
    default: "skystream-datalake-dev"
  catalog:
    description: "Unity Catalog catalog name (hoặc hive_metastore)"
    default: "hive_metastore"

# ─── Resources ────────────────────────────────────────────────────────────────
resources:

  # ── Delta Live Tables Pipeline (production streaming pipeline) ───────────────
  pipelines:
    skystream_dlt_pipeline:
      name: "SkyStream Analytics — DLT Pipeline [${bundle.target}]"
      catalog: workspace_7474644985505263
      target: skystream_${bundle.target}
      continuous: true
      photon: true
      development: true

      libraries:
        - notebook:
            path: ./notebooks/04_dlt_pipeline.py

      configuration:
        S3_BUCKET: ${var.s3_bucket}
        TRIGGER_INTERVAL: "10 seconds"

      clusters:
        - label: default
          spark_conf:
            spark.databricks.delta.preview.enabled: "true"

  # ── Databricks Jobs ──────────────────────────────────────────────────────────
  jobs:

    # Job 1: Chạy một lần khi setup — load airports reference table
    airports_loader_job:
      name: "SkyStream — Load Airports Reference [${bundle.target}]"
      max_concurrent_runs: 1

      tasks:
        - task_key: load_airports
          notebook_task:
            notebook_path: ./reference/airports_loader.py
          environment_key: serverless

      environments:
        - environment_key: serverless
          spec:
            client: "1"

    # Job 2: Chạy notebook Bronze → Silver → Gold riêng lẻ (không dùng DLT)
    # Dùng cho debug hoặc môi trường không có DLT license
    skystream_streaming_job:
      name: "SkyStream — Streaming Pipeline (non-DLT) [${bundle.target}]"
      max_concurrent_runs: 1

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze_autoloader.py
            base_parameters:
              S3_BUCKET: ${var.s3_bucket}
          environment_key: serverless

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/02_silver_transform.py
            base_parameters:
              S3_BUCKET: ${var.s3_bucket}
          environment_key: serverless

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/03_gold_analytics.py
            base_parameters:
              S3_BUCKET: ${var.s3_bucket}
          environment_key: serverless

      environments:
        - environment_key: serverless
          spec:
            client: "1"

    # Job 3: Batch Layer — chạy mỗi ngày lúc 2:00 AM UTC
    batch_layer_job:
      name: "SkyStream — Batch Layer (Lambda) [${bundle.target}]"
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED

      tasks:
        - task_key: run_batch_layer
          notebook_task:
            notebook_path: ./notebooks/05_batch_layer.py
          environment_key: serverless

      environments:
        - environment_key: serverless
          spec:
            client: "1"

    # Job 4: Serving Layer — chạy sau Batch Layer, mỗi ngày lúc 4:00 AM UTC
    serving_layer_job:
      name: "SkyStream — Serving Layer (Lambda) [${bundle.target}]"
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 4 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED

      tasks:
        - task_key: run_serving_layer
          notebook_task:
            notebook_path: ./notebooks/06_serving_layer.py
          environment_key: serverless

      environments:
        - environment_key: serverless
          spec:
            client: "1"

# ─── Targets (environments) ───────────────────────────────────────────────────
targets:

  # Dev environment — cheap cluster, development mode DLT
  dev:
    mode: development
    default: true
    workspace:
      host: "https://dbc-eb803386-bec5.cloud.databricks.com"          
    variables:
      s3_bucket: "skystream-datalake-dev"

  # Production environment — full performance
  prod:
    mode: production
    workspace:
      host: "https://dbc-eb803386-bec5.cloud.databricks.com"        
    variables:
      s3_bucket: "skystream-datalake-prod"
    resources:
      pipelines:
        skystream_dlt_pipeline:
          development: false
          photon: true
          clusters:
            - label: default
              node_type_id: "i3.xlarge"
              num_workers: 2
              aws_attributes:
                instance_profile_arn: "arn:aws:iam::020426224060:instance-profile/skystream-databricks-role"
