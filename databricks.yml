# Databricks Asset Bundle — SkyStream Analytics
# Docs: https://docs.databricks.com/en/dev-tools/bundles/index.html
#
# Cách deploy:
#   Dev  : databricks bundle deploy --target dev
#   Prod : databricks bundle deploy --target prod
#
# Cách chạy pipeline sau deploy:
#   databricks bundle run skystream_dlt_pipeline --target dev

bundle:
  name: skystream-analytics

# ─── Biến dùng chung ──────────────────────────────────────────────────────────
variables:
  s3_bucket:
    description: "S3 data lake bucket name"
    default: "skystream-datalake-dev"
  catalog:
    description: "Unity Catalog catalog name (hoặc hive_metastore)"
    default: "hive_metastore"

# ─── Resources ────────────────────────────────────────────────────────────────
resources:

  # ── Delta Live Tables Pipeline (production streaming pipeline) ───────────────
  pipelines:
    skystream_dlt_pipeline:
      name: "SkyStream Analytics — DLT Pipeline [${bundle.target}]"
      target: skystream_${bundle.target}           # schema prefix per environment
      continuous: true                              # CONTINUOUS streaming mode
      photon: true                                  # Photon engine cho throughput cao
      development: true                             # dev mode = cheaper cluster (overridden in prod target)

      libraries:
        - notebook:
            path: ${workspace.file_path}/notebooks/04_dlt_pipeline.py

      configuration:
        S3_BUCKET: ${var.s3_bucket}
        TRIGGER_INTERVAL: "10 seconds"

      clusters:
        - label: default
          node_type_id: "i3.xlarge"
          num_workers: 1
          autoscale:
            min_workers: 1
            max_workers: 3
          spark_conf:
            spark.databricks.delta.preview.enabled: "true"
          aws_attributes:
            instance_profile_arn: "arn:aws:iam::020426224060:instance-profile/skystream-databricks-role"   # điền ARN từ terraform output databricks_instance_profile_arn

      notifications:
        - email_recipients:
            - "buivanhuy0701@gmail.com"                       # điền email nhận thông báo lỗi pipeline
          alerts:
            - on_flow_failure

  # ── Databricks Jobs ──────────────────────────────────────────────────────────
  jobs:

    # Job 1: Chạy một lần khi setup — load airports reference table
    airports_loader_job:
      name: "SkyStream — Load Airports Reference [${bundle.target}]"
      max_concurrent_runs: 1

      tasks:
        - task_key: load_airports
          notebook_task:
            notebook_path: ${workspace.file_path}/reference/airports_loader.py
            source: WORKSPACE
          new_cluster:
            node_type_id: "m5.xlarge"
            num_workers: 1
            aws_attributes:
              instance_profile_arn: "arn:aws:iam::020426224060:instance-profile/skystream-databricks-role"   # điền ARN từ terraform output databricks_instance_profile_arn

    # Job 2: Chạy notebook Bronze → Silver → Gold riêng lẻ (không dùng DLT)
    # Dùng cho debug hoặc môi trường không có DLT license
    skystream_streaming_job:
      name: "SkyStream — Streaming Pipeline (non-DLT) [${bundle.target}]"
      max_concurrent_runs: 1

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/01_bronze_autoloader.py
            source: WORKSPACE
            base_parameters:
              S3_BUCKET: ${var.s3_bucket}
          new_cluster:
            node_type_id: "i3.xlarge"
            num_workers: 1
            aws_attributes:
              instance_profile_arn: ""

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/02_silver_transform.py
            source: WORKSPACE
            base_parameters:
              S3_BUCKET: ${var.s3_bucket}
          new_cluster:
            node_type_id: "i3.xlarge"
            num_workers: 1

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/03_gold_analytics.py
            source: WORKSPACE
            base_parameters:
              S3_BUCKET: ${var.s3_bucket}
          new_cluster:
            node_type_id: "i3.xlarge"
            num_workers: 2

# ─── Targets (environments) ───────────────────────────────────────────────────
targets:

  # Dev environment — cheap cluster, development mode DLT
  dev:
    mode: development
    default: true
    workspace:
      host: "https://dbc-eb803386-bec5.cloud.databricks.com"          
    variables:
      s3_bucket: "skystream-datalake-dev"

  # Production environment — full performance
  prod:
    mode: production
    workspace:
      host: "https://dbc-eb803386-bec5.cloud.databricks.com"        
    variables:
      s3_bucket: "skystream-datalake-prod"
    resources:
      pipelines:
        skystream_dlt_pipeline:
          development: false
          photon: true
          clusters:
            - label: default
              num_workers: 2
              autoscale:
                min_workers: 2
                max_workers: 5
